server:
  port: 8080

spring:
  application:
    name: project-a
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/study_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root123} # 走环境变量，本地默认 root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:} # 本地无密码留空
      timeout: 2s # 【W5 新增】Redis 命令执行超时时间，防止 Redis 宕机导致接口长时间阻塞
  threads:
    virtual:
      enabled: true # JDK21 虚拟线程

  # ========== W4 RabbitMQ 配置 ==========
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: study
    password: study123
    publisher-confirm-type: correlated # 开启确认机制
    publisher-returns: true            # 开启退回机制
    template:
      mandatory: true                  # 路由不到队列时触发 return
    listener:
      simple:
        acknowledge-mode: manual       # 手动 ACK
        prefetch: 1                    # 每次只取一条
        default-requeue-rejected: false # 拒绝后不进主队列（防死循环）
        retry:
          enabled: false               # 关掉 Spring 自带内存重试（用 TTL+DLX）

  # ========== W4 新增 AI 配置 ==========
  http:
    client:
      connect-timeout: 3s  # 连不上要快失败
      read-timeout: 30s    # 超时阈值 30s
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 4s
      on-client-errors: false
    deepseek:
      # 【提示】记得把这里换成你真实的 DeepSeek API Key，不然走的就是降级模板
      api-key: sk-placeholder
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 1500
  # ======================================

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 自定义 JWT 配置
jwt:
  secret: please-change-this-to-a-32-byte-random-string-2026
  expire-minutes: 120

# Swagger/Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"