services:
  mysql:
    image: mysql:8.0
    container_name: study-mysql
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: study_helper
      TZ: Asia/Shanghai
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command:
      - --default-time-zone=+8:00
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: study-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3.13-management
    container_name: study-rabbitmq
    ports:
      - '5672:5672'   # AMQP 协议端口，代码连这个
      - '15672:15672' # 控制台网页端口，浏览器看这个
    environment:
      RABBITMQ_DEFAULT_USER: study
      RABBITMQ_DEFAULT_PASS: study123

      TZ: Asia/Shanghai
    mem_limit: 512m
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped