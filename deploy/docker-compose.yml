services:
  mysql:
    image: mysql:8.0
    container_name: study-mysql
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: study_helper
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    command:
      - --default-time-zone=+8:00
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: study-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped

  rabbitmq:
    # 国内网络走 daocloud 镜像源；能直连 Docker Hub 的机器可改成 rabbitmq:3.13-management
    image: docker.m.daocloud.io/library/rabbitmq:3.13-management
    container_name: study-rabbitmq
    ports:
      - '5672:5672'    # AMQP 协议端口，代码连这个
      - '15672:15672'  # 控制台网页端口，浏览器看这个
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USERNAME:-study}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-study123}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # RabbitMQ 3.13 起 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 环境变量被废弃（设置了会直接启动失败），
      # 内存高水位改用配置文件：不设等于没保护，容器会被 OOM 杀掉而不是先掐生产者
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 512m
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 固定镜像 tag：不写 image 时 compose 会用 "<目录名>-<服务名>:latest"（这里是 deploy-app:latest），
    # 换台机器/换个目录名 tag 就变，benchmark 和 tag v1.0 对不上
    image: study-helper/app:v1.0
    container_name: study-app
    ports:
      - '8080:8080'
    environment:
      # 容器内走服务名，不是 127.0.0.1
      DB_URL: jdbc:mysql://mysql:3306/study_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MQ_HOST: rabbitmq
      MQ_PORT: '5672'
      MQ_USERNAME: ${MQ_USERNAME:-study}
      MQ_PASSWORD: ${MQ_PASSWORD:-study123}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-32-byte-random-string-2026}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 显式堆上限：Spring Boot 3.5 默认按物理内存 25% 取堆，压测会吃掉整机内存
      JAVA_TOOL_OPTIONS: '-Xmx512m -XX:MaxMetaspaceSize=192m'
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # temurin 运行镜像没有 curl/wget；/dev/tcp 只在 bash 里有，/bin/sh(dash) 会报
      # cannot create /dev/tcp/...，所以必须显式用 bash 探活
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mysql-data:
    name: study-mysql-data
  redis-data:
    name: study-redis-data
  rabbitmq-data:
    name: study-rabbitmq-data